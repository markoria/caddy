name: Build and Push Caddy Image

on:
  schedule:
    # Check for new Caddy versions daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: markoria/caddy

jobs:
  build-and-push-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Get Caddy version
        id: caddy-version
        run: |
          # Get the latest Caddy version from Docker Hub
          CADDY_VERSION=$(curl -s https://hub.docker.com/v2/repositories/library/caddy/tags?page_size=100 | jq -r '.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name' | sort -V | tail -1)
          echo "version=$CADDY_VERSION" >> $GITHUB_OUTPUT
          echo "Caddy version: $CADDY_VERSION"
          
          # Extract major and minor versions
          MAJOR=$(echo $CADDY_VERSION | cut -d. -f1)
          MINOR=$(echo $CADDY_VERSION | cut -d. -f1-2)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "Major version: $MAJOR"
          echo "Minor version: $MINOR"

      - name: Check if version already built
        id: check-version
        run: |
          # Check if this version tag already exists in our Docker Hub repo
          TOKEN=$(curl -s "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' | jq -r .token)
          
          TAG_EXISTS=$(curl -s -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_IMAGE }}/tags/${{ steps.caddy-version.outputs.version }}" \
            | jq -r '.name // "not_found"')
          
          if [ "$TAG_EXISTS" = "${{ steps.caddy-version.outputs.version }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Version ${{ steps.caddy-version.outputs.version }} already exists. Skipping build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.caddy-version.outputs.version }} not found or manual trigger. Proceeding with build."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.check-version.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.check-version.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ steps.caddy-version.outputs.version }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ steps.caddy-version.outputs.minor }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ steps.caddy-version.outputs.major }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        if: steps.check-version.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify pushed images
        if: steps.check-version.outputs.skip != 'true'
        run: |
          echo "Image pushed successfully to Docker Hub:"
          echo "- ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}"
      
      - name: No build needed
        if: steps.check-version.outputs.skip == 'true'
        run: |
          echo "Caddy version ${{ steps.caddy-version.outputs.version }} already built. Skipping."